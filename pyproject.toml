[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-exposure-intelligence"
version = "0.1.0"
description = "Consent-gated, lawful personal exposure-intelligence pipeline."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["wealth_exposure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
